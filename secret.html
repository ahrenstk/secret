<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>secret.html</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --primary-color: #000064;
        --secondary-color: #d4f2f5;
        --bg-color: #f4f6f9;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --focus-ring: rgba(0, 0, 100, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 5vh 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        height: 100vh;
        height: 100dvh;
        background-color: var(--bg-color);
        color: var(--text-color);
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 720px;
        width: 100%;
        height: 90vh;
        height: 90dvh;
        max-height: 90vh;
        max-height: 90dvh;
        background: var(--card-bg);
        padding: 20px 28px;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 100, 0.08), 0 8px 10px -6px rgba(0, 0, 100, 0.04);
        border: 3px solid var(--primary-color);
        overflow-y: auto;
      }
      .header {
        text-align: center;
        margin-bottom: 2px;
        flex-shrink: 0;
      }
      h3 {
        font-weight: 700;
        color: var(--primary-color);
        font-size: 24px;
        margin: 0 0 4px 0;
        letter-spacing: -0.5px;
      }
      .small-text {
        font-size: 0.85em;
        color: var(--text-muted);
        margin: 0;
        font-weight: 500;
      }
      
      /* Label & Button Header Row */
      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      label {
        font-weight: 600;
        color: var(--primary-color);
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      .copy-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 4px;
        transition: all 0.2s ease;
      }
      .copy-btn:active {
        transform: scale(0.95);
      }

      textarea, input {
        width: 100%;
        font-size: 14px;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: #fafafa;
        color: var(--text-color);
        transition: all 0.2s ease;
        font-family: inherit;
      }
      textarea:focus, input:focus {
        outline: none;
        border-color: var(--primary-color);
        background: #fff;
        box-shadow: 0 0 0 4px var(--focus-ring);
      }
      textarea {
        flex: 1 1 0;
        min-height: 80px;
        resize: none; /* Option A umgesetzt */
        line-height: 1.4;
      }
      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        flex-shrink: 0;
      }
      .password-wrapper input {
        padding-right: 44px;
      }
      .toggle-password-btn {
        position: absolute;
        right: 8px;
        background: transparent;
        border: none;
        padding: 6px;
        margin: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        border-radius: 6px;
        transition: all 0.2s ease;
      }
      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 2px 0;
        flex-shrink: 0;
      }
      #processBtn {
        padding: 10px 24px;
        font-size: 15px;
        cursor: pointer;
        border: none;
        background: var(--primary-color);
        color: #ffffff;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(0, 0, 100, 0.15);
      }
      #processBtn:active {
        transform: translateY(0);
      }
      #processBtn:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      #resultText {
        background-color: var(--secondary-color);
        border-color: rgba(0, 0, 100, 0.2);
        color: var(--primary-color);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
      }
      @media (max-width: 600px) {
        body {
          padding: 5vh 10px;
        }
        .container {
          padding: 16px;
          gap: 10px;
        }
        textarea, input {
          font-size: 13px;
        }
        #processBtn {
          font-size: 14px;
          width: 100%;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h3>secret.html</h3>
        <p class="small-text">AES-256-GCM, PBKDF2 (1 million iterations)</p>
      </div>
      
      <div class="label-row">
        <label for="inputText">Message (plain text or encrypted):</label>
        <button type="button" class="copy-btn" id="copyInputBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        </button>
      </div>
      <textarea
        id="inputText"
        placeholder="Type your message here...&#10;Save this HTML file, your password, and results securely!&#10;All data is processed exclusively locally within the browser.&#10;No external files or scripts are loaded.&#10;Feel free to review and verify the source code of this page."
      ></textarea>


      <label for="password">Password:</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter password" autocomplete="off" />
        <button type="button" id="togglePasswordBtn" class="toggle-password-btn" aria-label="Show/hide password">
          <svg
            id="eyeIcon"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="button-container">
        <button id="processBtn">Encrypt / Decrypt</button>
      </div>

      <!-- UNTERES LABEL MIT KOPIEREN-BUTTON -->
      <div class="label-row">
        <label for="resultText">Result:</label>
        <button type="button" class="copy-btn" id="copyResultBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        </button>
      </div>
      <textarea id="resultText" readonly placeholder="Your result will appear here..."></textarea>
    </div>

    <script>
      const PREFIX = "ENC:";
      const ITERATIONS = 1000000;
      const el = {
        input: document.getElementById("inputText"),
        password: document.getElementById("password"),
        togglePasswordBtn: document.getElementById("togglePasswordBtn"),
        eyeIcon: document.getElementById("eyeIcon"),
        btn: document.getElementById("processBtn"),
        result: document.getElementById("resultText"),
        copyInput: document.getElementById("copyInputBtn"),
        copyResult: document.getElementById("copyResultBtn"),
      };

      const svgEyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      const svgEyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

      function togglePasswordVisibility() {
        const isPassword = el.password.type === "password";
        el.password.type = isPassword ? "text" : "password";
        el.eyeIcon.innerHTML = isPassword ? svgEyeClosed : svgEyeOpen;
      }

      function getRandomIV() {
        const iv = new Uint8Array(12);
        window.crypto.getRandomValues(iv);
        return iv;
      }

      function getRandomSalt() {
        const salt = new Uint8Array(16);
        window.crypto.getRandomValues(salt);
        return salt;
      }

      async function generateKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveBits", "deriveKey"]
        );
        return window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: ITERATIONS,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function processText() {
        const text = el.input.value.trim();
        const password = el.password.value;

        if (!text || !password) {
          el.result.value = "Please enter text and password.";
          return;
        }

        el.btn.disabled = true;
        el.result.value = "Processing...";

        try {
          if (text.startsWith(PREFIX)) {
            const rawData = text.slice(PREFIX.length);
            const parts = rawData.split(":");
            const base64Regex = /^[A-Za-z0-9+/]+={0,2}$/;

            const isValidFormat =
              parts.length === 3 &&
              parts[0].length === 24 &&
              parts[1].length === 16 &&
              parts[2].length >= 24 &&
              parts.every(
                (part) => part.length % 4 === 0 && base64Regex.test(part)
              );

            if (!isValidFormat) {
              el.result.value = "Error: Input starts with ENC: but has an invalid encrypted format.";
              return;
            }

            const salt = await base64ToArrayBuffer(parts[0]);
            const iv = await base64ToArrayBuffer(parts[1]);
            const encryptedData = await base64ToArrayBuffer(parts[2]);
            const key = await generateKey(password, salt);

            const decrypted = await window.crypto.subtle.decrypt(
              { name: "AES-GCM", iv: iv },
              key,
              encryptedData
            );

            const dec = new TextDecoder();
            el.result.value = dec.decode(decrypted);

            new Uint8Array(salt).fill(0);
            new Uint8Array(iv).fill(0);
            new Uint8Array(encryptedData).fill(0);
            new Uint8Array(decrypted).fill(0);
          } else {
            const salt = getRandomSalt();
            const iv = getRandomIV();
            const key = await generateKey(password, salt);
            const enc = new TextEncoder();
            const rawTextBytes = enc.encode(text);

            const encrypted = await window.crypto.subtle.encrypt(
              { name: "AES-GCM", iv: iv },
              key,
              rawTextBytes
            );

            const saltB64 = await arrayBufferToBase64(salt.buffer || salt);
            const ivB64 = await arrayBufferToBase64(iv.buffer || iv);
            const encryptedB64 = await arrayBufferToBase64(encrypted);

            el.result.value = `${PREFIX}${saltB64}:${ivB64}:${encryptedB64}`;

            new Uint8Array(salt).fill(0);
            new Uint8Array(iv).fill(0);
            new Uint8Array(rawTextBytes).fill(0);
            new Uint8Array(encrypted).fill(0);
          }
        } catch (error) {
          console.error(error);
          el.result.value = "Incorrect password or corrupted data.";
        } finally {
          el.btn.disabled = false;
        }
      }

      function arrayBufferToBase64(buffer) {
        return new Promise((resolve) => {
          const blob = new Blob([buffer], { type: "application/octet-stream" });
          const reader = new FileReader();
          reader.onload = (e) => {
            resolve(e.target.result.split(",")[1]);
          };
          reader.readAsDataURL(blob);
        });
      }

      function base64ToArrayBuffer(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
      }

      async function copyToClipboard(textareaElement, buttonElement) {
        const textToCopy = textareaElement.value.trim();
        if (!textToCopy || textToCopy === "Processing..." || textToCopy.startsWith("Please enter") || textToCopy.startsWith("Error:")) {
          return;
        }

        try {
          await navigator.clipboard.writeText(textToCopy);
          

          const originalHTML = buttonElement.innerHTML;
          buttonElement.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Copied!
          `;
          buttonElement.style.color = "green";

          setTimeout(() => {
            buttonElement.innerHTML = originalHTML;
            buttonElement.style.color = "";
          }, 2000);
        } catch (err) {
          console.error("Failed to copy text: ", err);
        }
      }


      el.togglePasswordBtn.addEventListener("click", togglePasswordVisibility);
      el.btn.addEventListener("click", processText);


      el.copyInput.addEventListener("click", () => copyToClipboard(el.input, el.copyInput));
      el.copyResult.addEventListener("click", () => copyToClipboard(el.result, el.copyResult));

      el.password.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !el.btn.disabled) {
          event.preventDefault();
          processText();
        }
      });
    </script>
  </body>
</html>
